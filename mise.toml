[tools]
swift = '6.3.1'
"github:executor-cli/executor" = "0.22.0"
node = '24.15.0'

[env]
_.file = ".env.local"

[tasks.format]
description = "Format the code using SwiftFormat"
run = "executor format ."

[tasks.smoke]
description = "Run appstoreconnect-smoke print pipeline against the configured bundle id."
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Building example..."
swift build
echo "Running example..."
"$(swift build --show-bin-path)/appstoreconnect-smoke" fr.intech-consulting.markpages
'''

[tasks.export]
description = "Export profiles + certificates as files for the configured bundle id into ./out."
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Building example..."
swift build
echo "Exporting artifacts..."
"$(swift build --show-bin-path)/appstoreconnect-smoke" fr.intech-consulting.markpages --save-to ./out
'''

[tasks.test]
description = "Run package tests (cross-platform: works on macOS and Linux)."
run = "swift test"

[tasks.test-coverage]
description = "Run tests with executor-generated coverage report (requires xcrun; macOS only)."
run = '''
#!/usr/bin/env bash
set -euo pipefail
executor swift test --enable-code-coverage
executor test report --report-for-type swift ./
executor coverage swift --verbose
'''

[tasks.release]
description = "Run semantic-release. Use --dry-run to preview without publishing."
usage = '''
flag "-d --dry-run" help="Preview the release without publishing (no tag, no commit, no GitHub Release)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
flags=()
[ "${usage_dry_run:-false}" = "true" ] && flags+=(--dry-run)
npx -y \
  -p semantic-release@24 \
  -p @semantic-release/changelog@6 \
  -p @semantic-release/git@10 \
  semantic-release "${flags[@]}"
'''
